<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhatsApp Inbox — SMM</title>
<style>
  :root {
    --bg: #eae6df; --panel: #fff; --side: #f7f8fa; --text: #111b21; --muted: #667781;
    --line: #e3e5e8; --brand: #25D366; --brand-dark: #1da851; --teal: #075e54;
    --out: #d9fdd3; --in: #fff;
    --err-bg: #fdeded; --err-line: #f5c2c0; --err-text: #a4262c;
    --ok-bg: #edf7ee; --ok-line: #b7dfbb; --ok-text: #1e6c26;
    --warn-bg: #fff8e6; --warn-line: #f0d68a; --warn-text: #6b5410;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ── login gate ── */
  .gate {
    position: fixed; inset: 0; background: #f5f6f8; display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .gate.hidden { display: none; }
  .gate .box {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 28px; width: 100%; max-width: 380px;
  }
  .gate h1 { margin: 0 0 4px; font-size: 19px; }
  .gate p.sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }

  label { display: block; font-weight: 600; font-size: 12px; margin: 12px 0 5px; }
  input, select, textarea {
    width: 100%; padding: 9px 11px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #b9d2ff; outline-offset: -1px; }
  button {
    padding: 9px 14px; font-size: 14px; font-weight: 600; font-family: inherit;
    color: #fff; background: var(--teal); border: 0; border-radius: 6px; cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.wide { width: 100%; margin-top: 16px; }
  button.wa { background: var(--brand); }
  button.ghost { background: #eceef1; color: var(--text); }

  /* ── shell ── */
  .shell { display: none; height: 100vh; flex-direction: column; }
  .shell.on { display: flex; }

  .topbar {
    background: var(--teal); color: #fff; padding: 9px 14px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .topbar .brand { font-weight: 700; font-size: 15px; }
  .topbar .grow { flex: 1; }
  .topbar select { width: auto; padding: 5px 8px; font-size: 13px; border: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0b429; display: inline-block; }
  .dot.on { background: #6ee787; }
  .topbar .who { font-size: 12px; opacity: .9; }

  /* ── templates strip ── */
  .templates {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 9px 14px; display: flex; gap: 8px; align-items: center; overflow-x: auto;
  }
  .templates .label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { background: #f0f2f5; }
  .chip .badge { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  .chip.approved .badge { background: #25D366; }
  .chip.pending  .badge { background: #f0b429; }
  .chip.rejected .badge { background: #e5534b; }

  /* ── body split ── */
  .split { flex: 1; display: flex; min-height: 0; }
  .side { width: 300px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .side .newchat { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
  .side .newchat input { flex: 1; }
  .threads { flex: 1; overflow-y: auto; }
  .thread { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .thread:hover { background: #eef0f2; }
  .thread.active { background: #e2e8ec; }
  .thread .name { font-weight: 600; font-size: 13px; }
  .thread .prev { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 18px 12px; color: var(--muted); font-size: 13px; }

  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat .head {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 14px; display: flex; align-items: center; gap: 10px;
  }
  .chat .head .nm { font-weight: 600; }
  .chat .head .sm { color: var(--muted); font-size: 12px; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .bubble {
    max-width: 68%; padding: 7px 10px; border-radius: 8px; background: var(--in);
    box-shadow: 0 1px 1px rgba(0,0,0,.08); word-wrap: break-word; white-space: pre-wrap;
  }
  .bubble.out { align-self: flex-end; background: var(--out); }
  .bubble .meta { font-size: 10px; color: var(--muted); text-align: right; margin-top: 3px; }
  .bubble img, .bubble video { max-width: 100%; border-radius: 6px; display: block; }
  .bubble a.file { font-size: 13px; color: #027eb5; text-decoration: none; }
  .bubble .tpl { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }

  .composer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 14px; }
  .composer .row { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { resize: none; height: 40px; }
  .composer .opts { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .composer .opts label { margin: 0; font-weight: 500; font-size: 12px; color: var(--muted); }
  .composer input[type=file] { font-size: 12px; }

  .msg { margin: 8px 14px; padding: 9px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: var(--err-bg); border: 1px solid var(--err-line); color: var(--err-text); }
  .msg.ok    { background: var(--ok-bg);  border: 1px solid var(--ok-line);  color: var(--ok-text); }
  .msg.warn  { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text); }
  .msg.info  { background: #eef4ff; border: 1px solid #c3d7fb; color: #1b4a8f; }

  dialog { border: 0; border-radius: 10px; padding: 0; max-width: 440px; width: 92%; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg { padding: 20px; }
  .dlg h3 { margin: 0 0 4px; font-size: 16px; }
  .dlg p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .dlg .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>

<!-- ── LOGIN GATE ─────────────────────────────────────────────────────────── -->
<div class="gate" id="gate">
  <div class="box">
    <h1>WhatsApp Inbox</h1>
    <p class="sub">Sign in to open your business inbox.</p>

    <div id="gStep1">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@company.com" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="wide" id="btnLogin">Sign in</button>
    </div>

    <div id="gStep2" style="display:none">
      <label for="code">Verification code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" />
      <button class="wide" id="btnVerify">Verify &amp; open inbox</button>
    </div>

    <div id="gateMsg" class="msg" style="margin:14px 0 0"></div>
  </div>
</div>

<!-- ── APP ────────────────────────────────────────────────────────────────── -->
<div class="shell" id="shell">
  <div class="topbar">
    <span class="brand">WhatsApp Inbox</span>
    <select id="business"></select>
    <span><span class="dot" id="wsDot"></span> <span id="wsText" style="font-size:12px">connecting…</span></span>
    <span class="grow"></span>
    <span class="who" id="who"></span>
    <button class="ghost" id="btnLogout" style="padding:5px 10px;font-size:12px">Sign out</button>
  </div>

  <!-- templates strip -->
  <div class="templates" id="templates">
    <span class="label">Templates</span>
    <span class="empty" id="tplEmpty" style="padding:0">loading…</span>
  </div>

  <div class="split">
    <div class="side">
      <div class="newchat">
        <input id="newNumber" placeholder="Add number e.g. 923001234567" />
        <button id="btnOpenNumber">Open</button>
      </div>
      <div class="threads" id="threads"><div class="empty">No conversations yet.</div></div>
    </div>

    <div class="chat">
      <div class="head">
        <div>
          <div class="nm" id="chatName">Select a conversation</div>
          <div class="sm" id="chatSub">or type a number on the left to start one</div>
        </div>
      </div>

      <div class="msgs" id="msgs"></div>
      <div id="appMsg" class="msg"></div>

      <div class="composer">
        <div class="row">
          <textarea id="text" placeholder="Type a message… (free text only works inside the 24-hour window)"></textarea>
          <button class="wa" id="btnSend">Send</button>
        </div>
        <div class="opts">
          <label for="file">Media:</label>
          <input type="file" id="file" />
          <select id="mediaType" style="width:auto">
            <option value="image">image</option>
            <option value="document">document</option>
            <option value="audio">audio</option>
            <option value="video">video</option>
          </select>
          <button class="ghost" id="btnSendMedia">Send file</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- template send dialog -->
<dialog id="tplDlg">
  <form method="dialog" class="dlg">
    <h3 id="tplName">Send template</h3>
    <p id="tplMeta"></p>
    <label for="tplTo">Send to</label>
    <input id="tplTo" placeholder="923001234567" />
    <label for="tplVars">Variables (comma separated, if the template has any)</label>
    <input id="tplVars" placeholder="Ali, #1234" />
    <div class="actions">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="send" class="wa" id="tplSend">Send</button>
    </div>
  </form>
</dialog>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  var API = window.location.origin;
  var auth = { token: null, user: null };
  var businessId = null;
  var current = { conversationId: null, contact: null, name: null };
  var socket = null;
  var templates = [];

  var $ = function (id) { return document.getElementById(id); };

  function note(el, text, kind) {
    if (!text) { el.className = 'msg'; return; }
    el.textContent = text;
    el.className = 'msg show ' + (kind || 'info');
  }
  var gateNote = function (t, k) { note($('gateMsg'), t, k); };
  var appNote  = function (t, k) { note($('appMsg'), t, k); };

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: 'Bearer ' + auth.token }, opts.headers || {});
    return fetch(API + path, opts).then(function (r) {
      return r.json().then(function (b) { return { ok: r.ok, body: b }; });
    });
  }
  function postJson(path, body, token) {
    return fetch(API + path, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' },
        token ? { Authorization: 'Bearer ' + token } : {}),
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); });
  }
  var digits = function (v) { return String(v || '').replace(/\D/g, ''); };

  // ── auth ────────────────────────────────────────────────────────────────
  try {
    var saved = JSON.parse(sessionStorage.getItem('smm_auth') || 'null');
    if (saved && saved.token) auth = saved;
  } catch (e) {}

  $('btnLogin').addEventListener('click', function () {
    var email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) { gateNote('Enter your email and password.', 'error'); return; }
    this.disabled = true; gateNote('Checking…');
    postJson('/auth/login', { email: email, password: password }).then(function (res) {
      $('btnLogin').disabled = false;
      if (!res.ok) { gateNote(res.body.message || 'Sign-in failed.', 'error'); return; }
      $('gStep1').style.display = 'none';
      $('gStep2').style.display = 'block';
      gateNote('We emailed a 6-digit code to ' + email + '.', 'info');
      $('code').focus();
    }).catch(function (e) { $('btnLogin').disabled = false; gateNote(e.message, 'error'); });
  });

  $('btnVerify').addEventListener('click', function () {
    var code = $('code').value.trim();
    if (!code) { gateNote('Enter the code.', 'error'); return; }
    this.disabled = true; gateNote('Verifying…');
    postJson('/auth/verify-2fa', { email: $('email').value.trim(), code: code }).then(function (res) {
      $('btnVerify').disabled = false;
      if (!res.ok) { gateNote(res.body.message || 'Verification failed.', 'error'); return; }
      auth = { token: res.body.token, user: res.body.user };
      try { sessionStorage.setItem('smm_auth', JSON.stringify(auth)); } catch (e) {}
      boot();
    }).catch(function (e) { $('btnVerify').disabled = false; gateNote(e.message, 'error'); });
  });

  $('btnLogout').addEventListener('click', function () {
    try { sessionStorage.removeItem('smm_auth'); } catch (e) {}
    if (socket) socket.disconnect();
    location.reload();
  });

  // ── boot ────────────────────────────────────────────────────────────────
  function boot() {
    var u = auth.user || {};
    var list = u.businesses || [];
    $('who').textContent = u.name || u.email || '';

    if (!list.length) {
      gateNote('This account does not belong to any business.', 'warn');
      return;
    }

    var sel = $('business');
    sel.innerHTML = '';
    list.forEach(function (b) {
      var o = document.createElement('option');
      o.value = b.id; o.textContent = b.name;
      sel.appendChild(o);
    });
    businessId = list[0].id;

    $('gate').className = 'gate hidden';
    $('shell').className = 'shell on';

    connectSocket();
    loadTemplates();
    loadThreads();
  }

  $('business').addEventListener('change', function () {
    businessId = this.value;
    current = { conversationId: null, contact: null, name: null };
    $('msgs').innerHTML = '';
    $('chatName').textContent = 'Select a conversation';
    $('chatSub').textContent = '';
    joinRoom();
    loadTemplates();
    loadThreads();
  });

  // ── websocket ───────────────────────────────────────────────────────────
  function connectSocket() {
    socket = io(API, { transports: ['websocket', 'polling'] });

    socket.on('connect', function () {
      $('wsDot').className = 'dot on';
      $('wsText').textContent = 'live';
      joinRoom();
    });
    socket.on('disconnect', function () {
      $('wsDot').className = 'dot';
      $('wsText').textContent = 'offline';
    });

    // A customer replied.
    socket.on('message:inbound', function (data) {
      var conv = data.conversation || {};
      if (isOpen(conv)) appendMessage(data.message);
      loadThreads();
      if (!isOpen(conv)) {
        appNote('New message from ' + (conv.contact_name || conv.contact_identifier), 'info');
      }
    });

    // Something we sent (possibly from another tab).
    socket.on('message:outbound', function (data) {
      if (isOpen(data.conversation || {})) upsertMessage(data.message);
      loadThreads();
    });

    // Delivery / read receipts.
    socket.on('message:status', function (s) {
      var el = document.querySelector('[data-msg-id="' + s.id + '"] .meta .st');
      if (el) el.textContent = s.status;
      if (s.status === 'failed' && s.error_message) {
        appNote('Message failed: ' + s.error_message + ' (code ' + s.error_code + ')', 'error');
      }
    });
  }

  function joinRoom() {
    if (socket && socket.connected && businessId) socket.emit('join', { business_id: businessId });
  }
  function isOpen(conv) {
    if (current.conversationId && conv.id) return String(conv.id) === String(current.conversationId);
    if (current.contact && conv.contact_identifier) return conv.contact_identifier === current.contact;
    return false;
  }

  // ── templates strip ─────────────────────────────────────────────────────
  function loadTemplates() {
    api('/api/v1/whatsapp/templates?business_id=' + businessId + '&force_sync=false').then(function (res) {
      var strip = $('templates');
      strip.querySelectorAll('.chip').forEach(function (c) { c.remove(); });

      if (!res.ok) { $('tplEmpty').textContent = res.body.message || 'could not load'; return; }
      templates = res.body.templates || [];
      if (!templates.length) { $('tplEmpty').textContent = 'none yet'; return; }
      $('tplEmpty').style.display = 'none';

      templates.forEach(function (t) {
        var b = document.createElement('button');
        b.className = 'chip ' + String(t.status || '').toLowerCase();
        b.innerHTML = '<span class="badge"></span>' + t.name + ' <span style="color:#8b949e">· ' + (t.language || '') + '</span>';
        b.title = t.status;
        b.addEventListener('click', function () { openTemplateDialog(t); });
        strip.appendChild(b);
      });
    });
  }

  var pendingTpl = null;
  function openTemplateDialog(t) {
    pendingTpl = t;
    $('tplName').textContent = 'Send "' + t.name + '"';
    $('tplMeta').textContent = t.status + ' · ' + (t.category || '') + ' · ' + (t.language || '');
    $('tplTo').value = current.contact || '';
    $('tplVars').value = '';
    $('tplDlg').showModal();
  }

  $('tplDlg').addEventListener('close', function () {
    if (this.returnValue !== 'send' || !pendingTpl) return;
    var to = digits($('tplTo').value);
    if (!to) { appNote('Enter a number to send the template to.', 'error'); return; }

    var vars = $('tplVars').value.split(',').map(function (v) { return v.trim(); }).filter(Boolean);
    var components = vars.length
      ? [{ type: 'body', parameters: vars.map(function (v) { return { type: 'text', text: v }; }) }]
      : [];

    appNote('Sending template…');
    postJson('/api/v1/whatsapp/send/template', {
      business_id: Number(businessId),
      to: to,
      template_name: pendingTpl.name,
      language_code: pendingTpl.language || 'en_US',
      components: components
    }, auth.token).then(function (res) {
      if (!res.ok) { appNote(res.body.message || 'Template send failed.', 'error'); return; }
      appNote('Template sent.', 'ok');
      openChat({ contact_identifier: to });
    });
  });

  // ── threads ─────────────────────────────────────────────────────────────
  function loadThreads() {
    api('/api/v1/whatsapp/conversations?business_id=' + businessId).then(function (res) {
      var box = $('threads');
      if (!res.ok) { box.innerHTML = '<div class="empty">' + (res.body.message || 'could not load') + '</div>'; return; }
      var list = res.body.conversations || [];
      if (!list.length) { box.innerHTML = '<div class="empty">No conversations yet.</div>'; return; }

      box.innerHTML = '';
      list.forEach(function (c) {
        var d = document.createElement('div');
        d.className = 'thread' + (isOpen(c) ? ' active' : '');
        var prev = c.last_message ? preview(c.last_message) : '';
        d.innerHTML = '<div class="name">' + (c.contact_name || c.contact_identifier) + '</div>' +
                      '<div class="prev">' + prev + '</div>';
        d.addEventListener('click', function () { openChat(c); });
        box.appendChild(d);
      });
    });
  }

  function preview(m) {
    var p = m.payload || {};
    if (m.message_type === 'text') return (p.text && (p.text.body || p.body)) || 'text';
    if (m.message_type === 'template') return 'template: ' + ((p.template && p.template.name) || '');
    return m.message_type;
  }

  // ── open a chat (existing thread, or a raw number) ──────────────────────
  function openChat(conv) {
    current = {
      conversationId: conv.id || null,
      contact: conv.contact_identifier || null,
      name: conv.contact_name || conv.contact_identifier
    };
    $('chatName').textContent = current.name || current.contact;
    $('chatSub').textContent = current.contact || '';
    appNote('');
    loadMessages();
    loadThreads();
  }

  $('btnOpenNumber').addEventListener('click', function () {
    var n = digits($('newNumber').value);
    if (!n) { appNote('Enter a number with country code, digits only.', 'error'); return; }
    openChat({ contact_identifier: n });
    $('newNumber').value = '';
  });

  function loadMessages() {
    var q = current.conversationId
      ? 'conversation_id=' + current.conversationId
      : 'contact=' + encodeURIComponent(current.contact);

    api('/api/v1/whatsapp/messages?business_id=' + businessId + '&' + q).then(function (res) {
      var box = $('msgs');
      box.innerHTML = '';
      if (!res.ok) { appNote(res.body.message || 'Could not load messages.', 'error'); return; }
      if (res.body.conversation) current.conversationId = res.body.conversation.id;
      (res.body.messages || []).forEach(appendMessage);
      box.scrollTop = box.scrollHeight;
    });
  }

  function upsertMessage(m) {
    var existing = document.querySelector('[data-msg-id="' + m.id + '"]');
    if (existing) return;
    appendMessage(m);
  }

  function appendMessage(m) {
    var box = $('msgs');
    var d = document.createElement('div');
    d.className = 'bubble ' + (m.direction === 'outbound' ? 'out' : 'in');
    d.setAttribute('data-msg-id', m.id);

    var p = m.payload || {};
    var html = '';

    if (m.message_type === 'text') {
      html = escapeHtml((p.text && (p.text.body || p.body)) || '');
    } else if (m.message_type === 'template') {
      var tn = (p.template && p.template.name) || 'template';
      html = '<div class="tpl">template</div>' + escapeHtml(tn);
    } else {
      // Prefer our local copy (inbound downloads and outbound uploads both
      // leave one), then fall back to whatever public link was sent.
      var media = p[m.message_type] || {};
      var src = null;
      if (media.local_url) {
        // Stored as a site-relative path; a full URL is used as-is.
        src = /^https?:/i.test(media.local_url) ? media.local_url : API + media.local_url;
      } else if (media.link) {
        src = media.link;
      }

      if (!src) {
        html = '<span style="color:#667781">[' + m.message_type + ' — no preview]</span>';
      } else if (m.message_type === 'image') {
        html = '<img src="' + src + '" alt="image">';
      } else if (m.message_type === 'video') {
        html = '<video controls src="' + src + '"></video>';
      } else if (m.message_type === 'audio') {
        html = '<audio controls src="' + src + '" style="max-width:100%"></audio>';
      } else {
        html = '<a class="file" href="' + src + '" target="_blank" rel="noopener">📎 ' +
               escapeHtml(media.filename || m.message_type) + '</a>';
      }

      if (media.caption) html += '<div style="margin-top:4px">' + escapeHtml(media.caption) + '</div>';
    }

    var when = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    d.innerHTML = html + '<div class="meta">' + when +
      (m.direction === 'outbound' ? ' · <span class="st">' + m.status + '</span>' : '') + '</div>';

    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ── send text ───────────────────────────────────────────────────────────
  $('btnSend').addEventListener('click', function () {
    var body = $('text').value.trim();
    if (!current.contact) { appNote('Open a conversation first.', 'error'); return; }
    if (!body) return;

    this.disabled = true;
    postJson('/api/v1/whatsapp/send/text', {
      business_id: Number(businessId), to: current.contact, body: body
    }, auth.token).then(function (res) {
      $('btnSend').disabled = false;
      if (!res.ok) {
        appNote(res.body.message || 'Send failed.', 'error');
        return;
      }
      $('text').value = '';
      appNote('');
      // The socket echo adds the bubble; add it now too in case sockets are down.
      if (res.body.messageRecord) upsertMessage(res.body.messageRecord);
    }).catch(function (e) { $('btnSend').disabled = false; appNote(e.message, 'error'); });
  });

  $('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('btnSend').click(); }
  });

  // ── send media (raw file upload) ─────────────────────────────────────────
  $('btnSendMedia').addEventListener('click', function () {
    var f = $('file').files[0];
    if (!current.contact) { appNote('Open a conversation first.', 'error'); return; }
    if (!f) { appNote('Choose a file first.', 'error'); return; }

    var fd = new FormData();
    fd.append('business_id', businessId);
    fd.append('to', current.contact);
    fd.append('media_type', $('mediaType').value);
    fd.append('file', f);
    var cap = $('text').value.trim();
    if (cap) fd.append('caption', cap);

    this.disabled = true;
    appNote('Uploading and sending…');

    fetch(API + '/api/v1/whatsapp/send/media', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + auth.token },
      body: fd
    }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        $('btnSendMedia').disabled = false;
        if (!res.ok) { appNote(res.body.message || 'Media send failed.', 'error'); return; }
        appNote('Media sent.', 'ok');
        $('file').value = ''; $('text').value = '';
        if (res.body.messageRecord) upsertMessage(res.body.messageRecord);
      })
      .catch(function (e) { $('btnSendMedia').disabled = false; appNote(e.message, 'error'); });
  });

  if (auth.token && auth.user) boot();
})();
</script>
</body>
</html>
